    archeshedatatransformation-livereload:
      profiles:
        - livereload
      container_name: archeshedatatransformation-livereload
      image: he/arches_he_data_transformation:dev_build
      command: run_livereload
      volumes:
        - ../../arches:/web_root/arches
        - ../../arches_he_data_transformation:/web_root/arches_he_data_transformation
      env_file:
        - ./docker/env_file.env
      ports:
        - 35729:35729      
      depends_on:
          - archeshedatatransformation
      stdin_open: true
      tty: true
    
    archeshedatatransformation-webpack:
      container_name: archeshedatatransformation-webpack
      image: he/arches_he_data_transformation:dev_build
      command: run_webpack
      volumes:
        - ../../arches:/web_root/arches
        - ../../arches_he_data_transformation:/web_root/arches_he_data_transformation
      env_file:
        - ./docker/env_file.env
      ports:
        - 8028:8021
      depends_on:
          - archeshedatatransformation
      stdin_open: true
      tty: true

networks:
  default:
    external: true
    name: archeshedatatransformation-network

volumes:
    arches-log:
    arches-static:
