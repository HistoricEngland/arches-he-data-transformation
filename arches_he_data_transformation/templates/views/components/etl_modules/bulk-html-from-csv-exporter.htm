<div class="loading-mask" data-bind="visible: loading"></div>
<!-- ko ifnot: loading() -->
<!-- Task Details: show upload UI only in details state -->
<!-- ko if: ko.unwrap(state) === 'details' -->
<!-- Upload UI -->
<div data-bind="dropzone: dropzoneOptions" class="file-select loader-select" style="height: 100%; width: 100%; margin-top: 65px; background: white">
	<div>
		<div class="manifest-manager-main-menu-circle loader-button">
			<span><i style="color: #000" class="fa fa-cloud-upload r-select-icon"></i></span>
		</div>
		<h2>
			<span data-bind="text: $root.translations.uploadCsvFile"></span>
		</h2>
		<h3>
			<span data-bind="text: $root.translations.dropzoneFileUploadCaption"></span>
		</h3>
		<div style="display: flex; padding: 15px 25px; flex-direction: column; justify-content: center; align-items: center;">
			<div style="display:flex; flex-direction: column;">
				<div>
					<div class="dropzone-photo-upload" style="display:flex; margin-top: 0px;">
						<div style="border-top: 1px solid #c4c4c4; margin-bottom: 15px;" class="btn btn-primary btn-labeled btn-lg fa fa-file fileinput-button dz-clickable" data-bind="css: uniqueidClass, onEnterkeyClick, onSpaceClick" role="button" tabindex="0">
							<span data-bind="text: $root.translations.selectFile"></span>
						</div>
						<div style="min-height: 100%;">
							<div id="hidden-dz-previews" style="display:none"></div>
						</div>
					</div>
				</div>
			</div>
			<h4 class="rr-splash-description" style="white-space: pre-line;">
				<span data-bind="text: $root.translations.etlFileUploadBulkHtmlMessage"></span>
			</h4>
		</div>
	</div>
</div>
 
<!-- /ko -->
<!-- /ko -->

	<!-- Task Status: show export details only after successful completion -->
	<!-- ko if: ko.unwrap(state) === 'status' -->
	<div class="branch-csv-etl" style="display: grid; row-gap: 2px; height:fit-content; margin-top: 16px;">
		<div class="summary-title" style="padding-bottom: 20px;">
			<span data-bind="text: $root.translations.bulkHtmlFromCsvExporterSummary"></span>
		</div>

		<!-- Error state -->
		<!-- ko if: (selectedLoadEvent() && selectedLoadEvent().status === 'failed') || errorMessage -->
		<div class="branch-csv-etl-load-summmary" role="alert" aria-live="polite">
			<div class="summary-header">
				<span>Error</span>
			</div>
			<div class="summary-contents" style="padding-bottom: 20px;">
				<div class="etl-loading-metadata-value" data-bind="text: (loadDetails && loadDetails.error_message) || errorMessage"></div>
			</div>
		</div>
		<!-- /ko -->
		<!-- ko if: selectedLoadEvent() && selectedLoadEvent().status === 'indexed' && ko.unwrap(loadDetails) -->
		<div class="branch-csv-etl-load-summmary">

			<!-- Zipfile link -->
			<!-- ko if: loadDetails.zipfile -->
			<div class="summary-header">
				<span data-bind="text: $root.translations.downloadBulkHtmlZipFile"></span>
			</div>
			<div class="summary-contents" style="padding-bottom: 20px;">
				<div class="etl-loading-metadata-value">
					<a class="file-listing-link" style="color: blue;" download data-bind="text: loadDetails.zipfile.name, attr: { href: loadDetails.zipfile.url }"></a>
				</div>
			</div>
			<!-- /ko -->

			<!-- Export details -->
			<div class="summary-header">
				<span data-bind="text: $root.translations.exportDetails"></span>
			</div>
			<div class="summary-contents">
				<span class="etl-loading-metadata-key" data-bind="text: $root.translations.reportResourceTypeDetails"></span>
				<span class="etl-loading-metadata-value" data-bind="text: loadDetails.graphs"></span>
			</div>
			<div class="summary-contents">
				<span class="etl-loading-metadata-key" data-bind="text: $root.translations.resourceTotalExported"></span>
				<span class="etl-loading-metadata-value" data-bind="text: loadDetails.number_of_resources"></span>
			</div>
		</div>
		<!-- /ko -->
	</div>
	<!-- /ko -->
